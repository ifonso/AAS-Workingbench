[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aas_workingbench"
version = "0.1.0"

dependencies = [
    "PyQt6",
    # Head of branch aas_manager/develop. Pinned by SHA because the previous
    # branch (aas_manager/v301) was deleted upstream and broke installs.
    "basyx-python-sdk @ git+https://github.com/rwth-iat/basyx-python-sdk@412a53ffb2ee3eb761b4fd4d046a86b6ff06a111#subdirectory=sdk",
    "aas-test-engines==1.0.3",
    "pytz>=2023.3",
    "PyQt6-WebEngine",
    "PyQt6-QScintilla",
    "openpyxl>=3.1.2",
    "toml>=0.10.2",

    # Handover Documentation Tool
    "langchain==1.2.4",
    "langchain-classic==1.0.1",
    "langchain-text-splitters==1.1.0",
    "langchain-huggingface==1.2.0",
    "langchain-openai==1.1.7",
    "langchain-anthropic==1.3.1",
    "langchain-groq==1.1.1",
    "langchain-google-vertexai==3.2.1",
    "langchain-mistralai==1.1.1",
    "langchain-ollama==1.0.0",
    "langchain-community==0.4.1",
    "pypdf==6.6.0",
    "sentence-transformers==5.2.0",
    "torch",
    "faiss-cpu==1.13.2",
    "jsonschema",
]

requires-python = ">=3.11"
authors = [
  {name = "Igor Garmaev", email = "i.garmaev@iat.rwth-aachen.de"},
]
maintainers = [
  {name = "ifonso", email = "contato@ifonso.com.br"},
]
description = """
AAS Workingbench is a free, open source, cross-platform viewer/editor for Asset Administration Shell (AAS).
The editor is based on PyQt Framework and Eclipse BaSyx Python SDK (https://github.com/eclipse-basyx/basyx-python-sdk).
"""
readme = "README.md"
license = {text = "GNU General Public License v3.0"}
keywords = ["AAS", "AASX", "Asset Administration Shell", "Industrie 4.0"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python"
]

[project.urls]
Homepage = "https://github.com/ifonso/AAS-Workingbench"
Repository = "https://github.com/ifonso/AAS-Workingbench.git"
Issues = "https://github.com/ifonso/AAS-Workingbench/issues"

[project.gui-scripts]
aas_workingbench = "aas_workingbench.__main__:main"

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-qt>=4.4",
    "ruff>=0.12",
]
build = [
    "pyinstaller==6.15.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
# CPU-only torch keeps installs and CI small. The app only uses it for local
# embeddings in the Handover Documentation tool.
torch = [
    { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["aas_workingbench*"]

[tool.setuptools.package-data]
aas_workingbench = ["**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
qt_api = "pyqt6"
# Lets tests import shared helpers as `tests.factories`.
pythonpath = ["."]
markers = [
    "small: no I/O, sleeps or network; runs in milliseconds (tests/small).",
    "medium: single machine, may touch the filesystem (tests/medium).",
    "large: drives the full application (tests/large).",
]

[tool.coverage.run]
branch = true
source = ["aas_workingbench"]
omit = ["*/design.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

# Style follows the Google Python Style Guide; see
# docs/contributing/style-guide.md.
[tool.ruff]
line-length = 80
target-version = "py311"
src = ["src", "tests", "example"]
extend-exclude = [
    # Generated code.
    "src/aas_workingbench/design.py",
    "src/aas_workingbench/tools/handover_doc_llm/handover_submodel.py",
]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "B",    # likely bugs
    "C4",   # comprehensions
    "D",    # docstrings
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import order
    "N",    # naming
    "PLE",  # pylint errors
    "PLW",  # pylint warnings
    "PTH",  # prefer pathlib
    "RET",  # return statements
    "SIM",  # simplifications
    "UP",   # modern syntax
    "W",    # pycodestyle warnings
]
ignore = [
    "E501", # the formatter owns line length; long URLs are allowed
]

[tool.ruff.lint.isort]
force-single-line = true
force-sort-within-sections = true

[tool.ruff.lint.pydocstyle]
convention = "google"

# Legacy code keeps the bug-finding rules (F, W6, PLE) but is exempt from the
# stylistic ones; see docs/software/adr/0003-python-style.md. New packages are
# not listed here, so the full rule set applies to them. Shrink this list over
# time and never add new code to it.
[tool.ruff.lint.per-file-ignores]
"src/aas_workingbench/*.py" = ["B", "C4", "D", "E7", "F401", "F403", "F405", "F541", "F841", "I", "N", "PLW", "PTH", "RET", "SIM", "UP"]
"src/aas_workingbench/additional/**" = ["B", "C4", "D", "E7", "F401", "F403", "F405", "F541", "F841", "I", "N", "PLW", "PTH", "RET", "SIM", "UP"]
"src/aas_workingbench/models/**" = ["B", "C4", "D", "E7", "F401", "F403", "F405", "F541", "F841", "I", "N", "PLW", "PTH", "RET", "SIM", "UP"]
"src/aas_workingbench/settings/**" = ["B", "C4", "D", "E7", "F401", "F403", "F405", "F541", "F841", "I", "N", "PLW", "PTH", "RET", "SIM", "UP"]
"src/aas_workingbench/tools/**" = ["B", "C4", "D", "E7", "F401", "F403", "F405", "F541", "F841", "I", "N", "PLW", "PTH", "RET", "SIM", "UP"]
"src/aas_workingbench/treeviews/**" = ["B", "C4", "D", "E7", "F401", "F403", "F405", "F541", "F841", "I", "N", "PLW", "PTH", "RET", "SIM", "UP"]
"src/aas_workingbench/utils/**" = ["B", "C4", "D", "E7", "F401", "F403", "F405", "F541", "F841", "I", "N", "PLW", "PTH", "RET", "SIM", "UP"]
"src/aas_workingbench/widgets/**" = ["B", "C4", "D", "E7", "F401", "F403", "F405", "F541", "F841", "I", "N", "PLW", "PTH", "RET", "SIM", "UP"]
# Names used only in string annotations and never imported.
"src/aas_workingbench/dialogs.py" = ["F821"]
"src/aas_workingbench/models/table_packs.py" = ["F821"]
"src/aas_workingbench/models/table_standard.py" = ["F821"]
"src/aas_workingbench/tools/import_feature/import_file_widget.py" = ["F821"]
"src/aas_workingbench/tools/import_feature/import_util.py" = ["F821"]
"src/aas_workingbench/widgets/groupBoxes.py" = ["F821"]
# Trailing whitespace inside an LLM prompt string, where it is content.
"src/aas_workingbench/tools/handover_doc_llm/handover_documentation_tool.py" = ["W291"]
# Imports at the end of the module to avoid a circular import.
"src/aas_workingbench/package.py" = ["E402"]
"tests/**" = ["D"]
"tests/large/test_main_window.py" = ["D", "I", "N", "PLW", "PTH", "RET", "UP"]
"tests/medium/*.py" = ["B", "D", "I", "N", "PTH", "UP"]
"tests/small/test_util_type.py" = ["D", "F401", "I", "N", "PTH", "UP"]

# Type checking: rules with existing findings are warnings, which report the
# debt without failing CI. `strict` makes every rule an error in the layered
# packages, so new code starts clean; see docs/software/architecture.md.
[tool.pyright]
include = ["src", "tests"]
exclude = [
    "**/__pycache__",
    "src/aas_workingbench/design.py",
    "src/aas_workingbench/tools/handover_doc_llm/handover_submodel.py",
]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = [
    "src/aas_workingbench/application",
    "src/aas_workingbench/domain",
    "src/aas_workingbench/infrastructure",
    "src/aas_workingbench/ui",
]
reportArgumentType = "warning"
reportAssignmentType = "warning"
reportAttributeAccessIssue = "warning"
reportCallIssue = "warning"
reportGeneralTypeIssues = "warning"
reportIncompatibleMethodOverride = "warning"
reportIndexIssue = "warning"
reportInvalidTypeArguments = "warning"
reportInvalidTypeForm = "warning"
reportOperatorIssue = "warning"
reportOptionalMemberAccess = "warning"
reportOptionalOperand = "warning"
reportPossiblyUnboundVariable = "warning"
reportPrivateImportUsage = "warning"
reportRedeclaration = "warning"
reportReturnType = "warning"
reportUndefinedVariable = "warning"
