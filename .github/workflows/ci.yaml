name: CI

on:
  push:
  pull_request:

jobs:
  static-analysis:
    name: Format, lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run pyright

  test:
    name: Small and medium tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: uv sync --locked
      # Large tests are excluded: they drive QApplication.exec() and need
      # QtWebEngineCore (Chromium), which requires a GPU even when offscreen.
      - run: uv run pytest -m "small or medium" --cov --cov-report=term-missing
