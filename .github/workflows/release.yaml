name: Create release on push to main

# A push to main (a merged pull request is one) builds the release files and
# publishes them as a GitHub release, named after the version in pyproject.toml.
# When the tag of that version exists already, nothing is built and no release is
# made, so a push that does not change the version does not fail.
# "Run workflow" on another branch builds the files and publishes nothing.

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

# Two runs must not race to create the same tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Read the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag: ${{ steps.get_version.outputs.tag }}
      metamodel: ${{ steps.get_metamodel.outputs.version }}
      tag_exists: ${{ steps.tag_exists.outputs.exists }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The tags are needed to see whether this version was released.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - name: Get version from pyproject.toml
        id: get_version
        run: |
          VERSION=$(uv version --short)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Get metamodel version
        id: get_metamodel
        run: |
          VERSION=$(sed -n 's/^AAS_METAMODEL_VERSION = "\(.*\)"\r*$/\1/p' src/aas_workingbench/settings/app_settings.py)
          test -n "${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check whether the tag exists
        id: tag_exists
        env:
          TAG: ${{ steps.get_version.outputs.tag }}
        run: |
          if git rev-parse --quiet --verify "refs/tags/${TAG}" > /dev/null; then
            echo "The tag ${TAG} exists already: nothing to release."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build packages
    needs: prepare
    if: needs.prepare.outputs.tag_exists == 'false'
    uses: ./.github/workflows/build.yaml

  release:
    name: Create release
    needs: [prepare, build]
    # Only the main branch publishes. The tag does not exist yet (see above).
    if: needs.prepare.outputs.tag_exists == 'false' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      # Creates the tag and the release.
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download the packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate release notes
        # A repository without tags has no previous tag. The notes then list
        # every commit.
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)
          if [ -n "${PREV_TAG}" ]; then
            git log "${PREV_TAG}..HEAD" --pretty=format:"%h - %s (%an)" > release_notes.txt
          else
            git log HEAD --pretty=format:"%h - %s (%an)" > release_notes.txt
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          METAMODEL: ${{ needs.prepare.outputs.metamodel }}
        run: |
          ls -l dist
          gh release create "${TAG}" dist/* \
            --target "${GITHUB_SHA}" \
            --title "AAS Workingbench ${VERSION} (AAS Metamodel V${METAMODEL})" \
            --notes-file release_notes.txt
